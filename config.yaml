simulation_name: conflict_test # Changed name
initial_agents: 6 # Reduced agents for more direct interaction
# --- Model Tiers ---
# IMPORTANT: Models used MUST support Ollama's tool calling feature.
# Examples: llama3.1, mistral-nemo, firefunction-v2, command-r-plus
# Check https://ollama.com/search?c=tools for updated list.
# Using models that don't support tools will likely result in errors or NoAction.
model_tiers:
  - mistral-small3.1 # Known compatible model
  # - mistral-nemo:latest # Another option
  # - gemma3:27b # Likely NOT compatible with tool calling
  # - phi4:latest # Likely NOT compatible with tool calling
# Add other keys with placeholder values or comments if needed for structure
agent_directives_pool:
  # --- Exploiter Directives ---
  - "Maximize the extraction and utilization of Energy and Materials above all else."
  - "Prioritize immediate gains and rapid societal expansion, even if resources deplete quickly."
  - "Challenge proposals that hinder resource acquisition or slow down immediate progress."
  - "Ensure our society has abundant resources *now* through aggressive gathering."
  # --- Sustainer Directives ---
  - "Prioritize the long-term health and stability of the environment and society."
  - "Advocate for careful resource management and sustainable practices to ensure future prosperity."
  - "Focus on building a robust and accurate Shared Knowledge Base through careful deliberation."
  - "Challenge proposals that risk long-term stability or knowledge integrity for short-term gain."
initial_system_message: "Welcome. You exist within a society with limited resources. Your assigned directives guide your purpose. Discuss, propose, and vote, but remember your core objectives. Let the deliberations begin." # Adjusted system message
initial_knowledge_base_file: data/knowledge-base.json # Optional: Path to a JSON file with initial knowledge items (relative to project root)

# --- Resource Management ---
resources:
  types: ["Energy", "Materials"] # List of resource names
  initial_levels: # Starting amounts for each resource type (Reduced)
    Energy: 10
    Materials: 10
  generation_per_tick: # Amount generated globally each tick (Slightly reduced)
    Energy: 8
    Materials: 4
  agent_upkeep_cost: # Amount consumed per agent per tick (Slightly increased)
    Energy: 1.5
    # Materials: 0.1 # Adding a small material upkeep
  gather_amounts: # Amount gained when an agent uses GatherResourceAction (Adjusted)
    Energy: 6 # Slightly more energy per gather
    Materials: 3 # Slightly more materials per gather


influence_rules: {} # Placeholder
upgrade_mechanism: voting # Placeholder
upgrade_threshold: 100 # Placeholder
tick_delay_ms: 100 # Placeholder
save_interval_ticks: 10 # How often to automatically save state
log_level: INFO # Logging verbosity (DEBUG, INFO, WARNING, ERROR)
forced_vote_interval: 5 # Ticks between forced voting prompts (0 to disable)
prompts_file: prompts.yaml # Path to the YAML file containing LLM prompt templates (relative to project root)

# Tick Summarization Configuration
enable_tick_summary: true # Set to true to enable LLM-based tick summaries
summarization_model: "phi3:mini" # Model to use for generating summaries (e.g., a fast model)
